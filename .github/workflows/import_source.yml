name: Import reviewed CompanyAgent public source
on:
  push:
    paths:
      - 'staging/CompanyAgent_v0.9_Public_Source.zip'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify archive and unpack all 43 reviewed files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path("staging/CompanyAgent_v0.9_Public_Source.zip")
          expected = "113af48c25ce9efadf2ad226aa04eeff5deb5f2cc5dadf508716fc54cf66d646"
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, f"Unexpected source archive SHA256: {actual}"
          with zipfile.ZipFile(archive) as z:
              files = [m for m in z.infolist() if not m.is_dir()]
              assert len(files) == 43, f"Expected 43 reviewed files, got {len(files)}"
              for member in files:
                  parts = pathlib.PurePosixPath(member.filename).parts
                  assert len(parts) > 1 and parts[0] == "CompanyAgent", member.filename
                  assert all(part not in (".", "..") for part in parts), member.filename
                  destination = pathlib.Path(*parts[1:])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(member))
          print("Validated source archive and extracted 43 files")
          PY
      - name: Install public test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test the published source before committing
        run: python -m pytest -q
      - name: Publish reviewed source to main
        shell: bash
        run: |
          rm -f .github/workflows/import_source.yml
          rm -rf staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete CompanyAgent v0.9 public hackathon source"
          git push origin HEAD:main
