name: Public source smoke test
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q server.py enterprise src scripts
      - name: Parse Windows PowerShell acceptance runner (no API call)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/accept_tokendance.ps1).Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'TokenDance PowerShell launcher has a syntax error' }
      - name: Run public smoke test
        run: python -m pytest -q
