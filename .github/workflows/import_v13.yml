name: Verify and publish CompanyAgent v1.3 client workspace
on:
  push:
    paths:
      - 'staging/CompanyAgent_v1.3_Changeset_GitHub_Gated.zip'
permissions:
  contents: write
jobs:
  verify_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source digest and safe paths; overlay reviewed changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import zipfile,hashlib
          archive=Path('staging/CompanyAgent_v1.3_Changeset_GitHub_Gated.zip')
          expected='5d9093442e0ad920245b50386595fa737f945e05c38dd02fa8f730313c2cde10'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected, 'Archive hash changed'
          with zipfile.ZipFile(archive) as z:
              files=[x for x in z.infolist() if not x.is_dir()]
              assert len(files)==13, 'Unexpected file count'
              expected_paths={
                'README.md','docs/V13_CLIENT_WORKSPACE_AND_CHANGE_IMPACT.md',
                'docs/verification_v13/client-change-impact-desktop.png',
                'docs/verification_v13/client-proposal-desktop.png',
                'docs/verification_v13/client-proposal-mobile.png',
                'enterprise/api.py','enterprise/change_workflow.py',
                'enterprise_web/app.js','enterprise_web/index.html',
                'enterprise_web/styles.css','server.py',
                'tests/browser_v13.py','tests/test_client_workspace_v13.py'}
              got=set()
              for item in files:
                  parts=PurePosixPath(item.filename).parts
                  assert len(parts)>1 and parts[0]=='CompanyAgent'
                  assert all(x not in ('','.','..') for x in parts)
                  dest=PurePosixPath(*parts[1:])
                  assert not dest.is_absolute()
                  assert str(dest) in expected_paths
                  target=Path(str(dest))
                  assert not target.is_symlink()
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
                  got.add(str(dest))
              assert got==expected_paths
          print('v1.3 verified: exact reviewed 13-file change set over v1.2')
          PY
      - name: Install CI dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q server.py enterprise src
      - name: Frontend syntax check
        run: |
          node --check enterprise_web/app.js
          node --check web/app.js
      - name: Run full test suite (must pass before commit)
        run: python -m pytest -q
      - name: Publish only after all gates pass
        shell: bash
        run: |
          # Keep existing workflow intact, since GitHub App lacks workflow-update permission.
          git show HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/import_v13.yml
          rm -rf staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v1.3 client brief to AI proposal and cross-form change impact"
          git push origin HEAD:main
