name: Verify and publish CompanyAgent v1.0 source
on:
  push:
    paths:
      - 'staging/CompanyAgent_v1.0_Enterprise_GitHub_Ready.zip'
      - '.github/workflows/import_v10.yml'
permissions:
  contents: write
jobs:
  verify_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archive and extract public files
        run: |
          python - <<'PY'
          import pathlib, hashlib, zipfile
          src=pathlib.Path('staging/CompanyAgent_v1.0_Enterprise_GitHub_Ready.zip')
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='36186e9c9031f90bdce321ef103ef5b571ba146e50663f33be0c2e827b69afd5', 'Archive checksum mismatch'
          with zipfile.ZipFile(src) as z:
              fs=[f for f in z.infolist() if not f.is_dir()]
              assert len(fs)==51, f'Expected 51 reviewed files, got {len(fs)}'
              for item in fs:
                  parts=pathlib.PurePosixPath(item.filename).parts
                  assert len(parts)>1 and parts[0]=='CompanyAgent', item.filename
                  assert all(p not in ('','.','..') for p in parts), item.filename
                  dest=pathlib.Path(*parts[1:])
                  assert not dest.is_absolute() and not dest.is_symlink(), item.filename
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(item))
          print('Source integrity verified; 51 reviewed files extracted')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q server.py enterprise src
      - name: Frontend static syntax check
        run: |
          node --check enterprise_web/app.js
          node --check web/app.js
      - name: Run all public regression tests before publication
        run: python -m pytest -q
      - name: Publish only after every test passed
        run: |
          # CI workflow updates require special GitHub App permissions.
          # Keep the already-approved workflow; it still runs all pytest tests.
          git show HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/import_v10.yml
          rm -rf staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v1.0 evidence quality gate, demo approval and interactive HTML"
          git push origin HEAD:main
